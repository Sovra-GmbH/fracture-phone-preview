<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      overflow: hidden;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #cap, #end {
      position: fixed;
      pointer-events: none;
      z-index: 2;
    }
    #cap {
      left: 8vw;
      right: 8vw;
      bottom: 8.5vh;
      text-align: center;
      opacity: 0;
      font-size: clamp(13px, 1.45vw, 19px);
      line-height: 1.3;
      text-shadow: 0 0 28px #0a0a0f, 0 0 8px #0a0a0f;
    }
    #cap.near {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      color: #edcbb3;
      letter-spacing: 0.03em;
    }
    #cap.far {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 300;
      color: #9bb4c4;
      letter-spacing: 0.16em;
      word-spacing: 0.12em;
    }
    #cap.aftermath {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 400;
      color: #c4b0a4;
      letter-spacing: 0.14em;
      font-size: clamp(13px, 1.35vw, 18px);
    }
    #end {
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 300;
      font-size: clamp(22px, 2.4vw, 34px);
      letter-spacing: 0.07em;
      color: #d5cfc6;
      text-align: center;
      opacity: 0;
      text-shadow: 0 0 32px #0a0a0f;
    }
  </style>
</head>
<body>
  <div id="cap"></div>
  <div id="end">I have no when.</div>
  <script type="module" src="grok-boot.js"></script>
</body>
</html>
