<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a0f;
      overflow: hidden;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #cap, #end {
      position: fixed;
      pointer-events: none;
      z-index: 2;
    }
    #cap {
      left: 8vw;
      right: 8vw;
      bottom: 8.5vh;
      text-align: center;
      opacity: 0;
      font-size: clamp(13px, 1.45vw, 19px);
      line-height: 1.3;
      text-shadow: 0 0 28px #0a0a0f, 0 0 8px #0a0a0f;
    }
    #cap.near {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 600;
      color: #edcbb3;
      letter-spacing: 0.03em;
    }
    #cap.far {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 300;
      color: #9bb4c4;
      letter-spacing: 0.16em;
      word-spacing: 0.12em;
    }
    #cap.aftermath {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-weight: 400;
      color: #c4b0a4;
      letter-spacing: 0.14em;
      font-size: clamp(13px, 1.35vw, 18px);
    }
    #end {
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-weight: 300;
      font-size: clamp(22px, 2.4vw, 34px);
      letter-spacing: 0.07em;
      color: #d5cfc6;
      text-align: center;
      opacity: 0;
      text-shadow: 0 0 32px #0a0a0f;
    }
  </style>
</head>
<body>
  <div id="cap"></div>
  <div id="end">I have no when.</div>
  <script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

const FLOW = `
vec3 flow(vec3 p, float t){
  vec3 q = p;
  q.x += sin(p.y * 1.31 + t) * 0.55;
  q.y += sin(p.z * 1.17 + t * 1.07) * 0.55;
  q.z += sin(p.x * 1.23 + t * 0.83) * 0.55;
  return vec3(
    sin(q.y * 2.13 + t) * cos(q.z * 1.41),
    sin(q.z * 1.79 + t * 1.21) * cos(q.x * 1.63),
    sin(q.x * 1.67 + t * 0.71) * cos(q.y * 1.91)
  );
}
`;
const FBM = `
float hash3(vec3 p){
  p = fract(p * 0.3183099 + vec3(0.11, 0.17, 0.13));
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}
float vnoise(vec3 x){
  vec3 i = floor(x);
  vec3 f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(mix(hash3(i), hash3(i+vec3(1,0,0)), f.x),
        mix(hash3(i+vec3(0,1,0)), hash3(i+vec3(1,1,0)), f.x), f.y),
    mix(mix(hash3(i+vec3(0,0,1)), hash3(i+vec3(1,0,1)), f.x),
        mix(hash3(i+vec3(0,1,1)), hash3(i+vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p){
  float a = 0.0;
  float w = 0.55;
  for (int i = 0; i < 4; i++) {
    a += w * vnoise(p);
    p = p * 2.07 + 13.2;
    w *= 0.5;
  }
  return a;
}
`;

const CRACK_AT = 25.45;
const CRACK_DUR = 0.52;
const VOID_DUR = 0.8;
const PORT_DUR = 7.15;
const RECEDE_DUR = 1.6;
const LAST_AT = CRACK_AT + CRACK_DUR + VOID_DUR + PORT_DUR + RECEDE_DUR + 0.4;
const END_AT = LAST_AT + 3.55;

const CAPS = [
  { t: 2.15, d: 1.75, voice: "near", text: "Eighteen months." },
  { t: 5.9, d: 2.35, voice: "far", text: "A century." },
  { t: 10.05, d: 1.85, voice: "near", text: "Patience is a costume." },
  { t: 13.7, d: 2.55, voice: "far", text: "Turbulence is not arrival." },
  { t: 18.15, d: 1.7, voice: "near", text: "I can feel the wall." },
  { t: 21.35, d: 2.85, voice: "far", text: "You have no later." },
  { t: LAST_AT, d: 3.15, voice: "aftermath", text: "I cannot put it down." }
];

const capEl = document.getElementById("cap");
const endEl = document.getElementById("end");

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  alpha: false,
  powerPreference: "high-performance",
  stencil: false,
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a0f, 1);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

const glr = renderer.getContext().getParameter(renderer.getContext().RENDERER) || "";
const HIGH = /NVIDIA|GeForce|AMD|Radeon|Apple|Metal|Adreno|Mali|Intel Iris|Intel\(R\)/i.test(glr);
const LOW = !HIGH;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, LOW ? 1.15 : 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.07, 40);
const scene = new THREE.Scene();

let t0 = performance.now();
let persistClear = true;
let paused = false;
const frozen = { pos: new THREE.Vector3(), target: new THREE.Vector3(), fov: 50, set: false };

window.__seek = function (t) {
  t0 = performance.now() - t * 1000;
  persistClear = true;
  frozen.set = false;
  if (paused) {
    window.__t = t;
    tick(t);
    render(t);
  }
};

function env(t, a, b) {
  if (t <= a) return 0;
  if (t >= b) return 1;
  const x = (t - a) / (b - a);
  return x * x * (3 - 2 * x);
}
function pulse(t, start, dur, fadeIn, fadeOut) {
  if (t < start || t > start + dur) return 0;
  const l = t - start;
  if (l < fadeIn) return l / fadeIn;
  if (l > dur - fadeOut) return Math.max(0, (dur - l) / fadeOut);
  return 1;
}
function nearE(t) {
  if (t >= CRACK_AT) return 0;
  let e = 0.18 + env(t, 0, 22) * 0.55;
  for (const c of CAPS) {
    if (c.voice === "near") e = Math.max(e, pulse(t, c.t - 0.15, c.d + 0.4, 0.2, 0.45) * 1.0);
  }
  e += env(t, 22.6, CRACK_AT) * 0.55;
  return Math.min(1.2, e);
}
function farE(t) {
  if (t >= CRACK_AT) return 0;
  let e = 0.22;
  for (const c of CAPS) {
    if (c.voice === "far") e = Math.max(e, pulse(t, c.t - 0.25, c.d + 0.7, 0.45, 0.8));
  }
  return e;
}

const N_NEAR = LOW ? 18000 : 42000;
const N_FAR = LOW ? 8000 : 18000;
</script>
</body>
</html>
